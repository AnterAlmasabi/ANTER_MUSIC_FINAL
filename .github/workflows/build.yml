name: Build ANTER MUSIC APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: anter-music-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Gradle wrapper
        run: |
          mkdir -p /tmp/wrap && cd /tmp/wrap
          echo "rootProject.name = 'wrap'" > settings.gradle
          gradle wrapper --gradle-version 8.13 --no-daemon
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/android/gradle/wrapper/"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTER-MUSIC-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
